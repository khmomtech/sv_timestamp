name: sv_timestamp
description: SV TimeStamp - capture photos stamped with time, location, logo and more.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.10.0+1
  geolocator: ^9.0.2
  permission_handler: ^11.3.1
  path_provider: ^2.0.15
  intl: ^0.18.0
  provider: ^6.0.5
  cupertino_icons: ^1.0.8
  image: ^4.6.0
  geocoding: ^4.0.0
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/logo.png

  